<div class="h-[100vh] w-full">

  <div class="grid grid-cols-2 grid-flow-col gap-4 h-full w-full">
    <div id="first_panel" class="">
      <div class="h-full flex justify-items-center self-center text-center">
        <div class="bg-primary-500 p-10 w-full flex justify-center items-center">

          <div class="sm:w-7/12 md:w-8/12 lg:w-9/12   bg-slate-50  rounded-xl shadow-xl" id="card-body">

            <div class="p-5">
              <h2 class="font-semibold text-2xl">Bem-vindo ao <span class="text-primary-500">DietSavvy</span>!</h2>
            </div>

            <div class="p-5">
              <form>
                <div class="mb-4 text-start">
                    <div class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring focus:border-blue-300 flex justify-center items-center gap-3">
                      <i class="bi bi-envelope text-slate-400" ></i>
                      <input [formControl]="email" type="email" id="email" name="email" placeholder="Email" class="w-full bg-gray-100 outline-none" />
                    </div>

                </div>
                <div class="mb-6 text-start">
                  <div class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring focus:border-blue-300 flex justify-center items-center gap-3">
                    <i class="bi bi-lock text-slate-400" ></i>
                    <input [formControl]="password" [type]="isPasswordVisible ? 'text' : 'password' " id="password" name="password" placeholder="Password" class="w-full bg-gray-100 outline-none" />
                    <i (click)="changePasswordVisible()" class="bi bi-eye-slash text-slate-400 cursor-pointer" ></i>
                  </div>
                </div>
                <button type="button" (click)="loginWithEmail()" class="w-full px-4 py-2 font-semibold text-white bg-primary-600 rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50">Login</button>
            </form>
            <div class="my-6 text-center text-gray-500 flex justify-center items-center gap-4">
              <span class="border border-slate-200 w-full"></span>
              <span>or</span>
              <span class="border border-slate-200 w-full"></span>
            </div>
            <button (click)="loginWithGoogle()" class="w-full px-4 py-2 font-semibold text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
                <div class="flex items-center justify-center">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="w-5 h-5 mr-2">
                    Login with Google
                </div>
            </button>
            </div>

            <!-- <button  class="bg-slate-50 rounded-lg p-10">Entrar com Google</button> -->
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="h-full w-full flex justify-center items-center content-center">
        <img src="/assets/DietSavvyLogo.png" alt="">
      </div>

    </div>
  </div>

  <!-- first panel -->


  <!-- second panel -->




</div>
